<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Formulário</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <header>
        <h1>Formulário</h1>
        <p>Preencha o formulário abaixo para ter um aventura saborosa!</p>
    </header>

    <nav>
        <a href="index.html">Index</a>
    </nav>

    <main>

        <section>

            <h2>Formulário de Contato</h2>
            <p>Por favor, preencha os campos abaixo:</p>

            <form action="#" method="post">
                <label for="nome">Nome:</label>
                <input type="text" id="nome" name="nome" required>

                <label for="email">Email:</label>
                <input type="email" id="email" name="email" required>

                <label for="nascimento">Data de Nascimento:</label>
                <input type="date" id="nascimento" name="nascimento">

                <label for="cardapio">Escolha seu sabor:</label>

                <select id="cardapio">
                    <option value="pastel de carne">Pastel de Carne</option>
                    <option value="pastel de palmito">Pastel de Palmito</option>
                    <option value="pastel de queijo">Pastel de Queijo</option>
                    <option value="pastel de frango">Pastel de Frango</option>
                    <option value="pastel de goiabada">Pastel de Queijo e Goiabada</option>
                    <option value="chocolate">Pastel de Chocolate</option>
                    <option value="chocolate com morango">Pastel de Chocolate com Morango</option>
                    <option value="pastel de banana">Pastel de Banana</option>
                </select>

                 <fieldset>
                    <legend>Recomendaria o Pastel Cósmico?</legend>

                    <label class="opcao">
                        <input type="radio" name="recomendacao" value="sim" required>
                        Sim
                    </label>

                    <label class="opcao">
                        <input type="radio" name="recomendacao" value="nao" required>
                        Não
                    </label>

                </fieldset>

                    <label for="mensagem">Mensagem:</label>
                    <textarea id="mensagem" name="mensagem" rows="5"></textarea>

                    <label class="opcao">
                        <input type="checkbox" name="novidade">
                        Desejo receber novidades para mais sabores cósmicos!
                    </label>

                    <div class="botoes">
                        
                        <button type="submit">Enviar</button>
                        <button type="reset">Limpar</button>

                    </div>

                 </form>

                </section>
    </main>

    <footer>

         <h3> Fale com o Pastel Cósmico</h3>
            <p>Telefone: (47) 3333-4567</p>
            <p>Email: contato@pastelcosmico.com</p>
            <p>Endereço: 1092 Av. Cel. Severiano Maia</p>
            
    </footer>

    
</body>
</html>
